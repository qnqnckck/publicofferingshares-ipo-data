name: Workflow watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 23 * * 0-4"
    - cron: "*/5 0-10 * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: workflow-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check recent workflow activity
        run: python tool/workflow_watchdog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_OCR_MAX_AGE_MINUTES: "35"
          WATCHDOG_BATCH_MAX_AGE_MINUTES: "1560"
