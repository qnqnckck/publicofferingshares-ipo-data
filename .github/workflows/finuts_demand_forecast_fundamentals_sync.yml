name: Finuts demand forecast fundamentals sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5"
    - cron: "20 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: finuts-demand-forecast-fundamentals-sync
  cancel-in-progress: false

jobs:
  finuts-demand-forecast-fundamentals-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Ensure manual fundamentals file exists
        run: |
          if [ ! -f data/manual_fundamentals.json ]; then
            printf '{\n  "stocks": []\n}\n' > data/manual_fundamentals.json
          fi

      - name: Refresh Finuts fundamentals overrides
        run: python tool/finuts_fundamentals_sync.py --mode demand-today

      - name: Rebuild derived IPO data
        run: >
          dart run tool/ipo_competition_batch.dart
          --backfill-years 3
          --manual-fundamentals-path data/manual_fundamentals.json
          --no-discover
          --no-identifier-discover
          --no-ipo-korea-supplement
          --no-article-lead-manager-discover
          --no-public-live-collect

      - name: Validate Finuts schedule sync
        continue-on-error: true
        run: python tool/validate_finuts_schedule_sync.py --warn-on-analysis-issues

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/manual_fundamentals.json data/outcomes ipo_competition_data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ipo-competition-bot"
          git config user.email "ipo-competition-bot@users.noreply.github.com"
          git add data/manual_fundamentals.json data/outcomes ipo_competition_data
          git commit -m "Sync Finuts demand forecast fundamentals"
          git push
