name: Finuts smoke test

on:
  workflow_dispatch:
    inputs:
      finuts_url:
        description: "Full Finuts IPO detail URL"
        required: true
        default: "https://www.finuts.co.kr/html/ipo/ipoView.php?ipo_sn=100535"
      deposit_manwon:
        description: "search_scscs_wrtm value in 만원"
        required: true
        default: "100"

permissions:
  contents: read

concurrency:
  group: finuts-smoke-test
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Run Finuts smoke test
        run: |
          python tool/finuts_smoke_test.py \
            --finuts-url "${{ inputs.finuts_url }}" \
            --deposit-manwon "${{ inputs.deposit_manwon }}"
        env:
          FINUTS_ID: ${{ secrets.FINUTS_ID }}
          FINUTS_PASSWORD: ${{ secrets.FINUTS_PASSWORD }}
