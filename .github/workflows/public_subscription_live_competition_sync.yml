name: Public subscription live competition sync

on:
  workflow_dispatch:
  schedule:
    - cron: "50 0-7 * * 1-5"
    - cron: "10 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: public-subscription-live-competition-sync
  cancel-in-progress: true

jobs:
  public-subscription-live-competition-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Ensure manual fundamentals file exists
        run: |
          if [ ! -f data/manual_fundamentals.json ]; then
            printf '{\n  "stocks": []\n}\n' > data/manual_fundamentals.json
          fi

      - name: Refresh public live competition data
        run: >
          dart run tool/ipo_competition_batch.dart
          --backfill-years 3
          --manual-fundamentals-path data/manual_fundamentals.json
          --no-discover
          --no-identifier-discover
          --no-ipo-korea-supplement
          --no-article-lead-manager-discover

      - name: Validate public schedule sync
        run: python tool/validate_finuts_schedule_sync.py --warn-on-analysis-issues

      - name: Commit generated data
        run: |
          if git diff --quiet -- ipo_competition_data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ipo-competition-bot"
          git config user.email "ipo-competition-bot@users.noreply.github.com"
          git add ipo_competition_data
          git commit -m "Sync public live subscription competition data"
          git push
