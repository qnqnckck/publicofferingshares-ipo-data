name: Finuts manual stock backfill

on:
  workflow_dispatch:
    inputs:
      stock_id:
        description: "Target IPO stock id in seed/data identifiers (ex: machinarax_2026)"
        required: true
        default: "machinarax_2026"
      finuts_url:
        description: "Optional Finuts IPO detail URL. If empty, auto-discover from catalog/seed name match"
        required: false
        default: ""
      deposit_manwon:
        description: "finutsSearchDepositManwon value in 만원"
        required: false
        default: "100"
      include_all_stocks:
        description: "Set true to process all in-scope IPOs in scheduleAutoload. Leave false for single-stock focused runs."
        required: false
        type: boolean
        default: false
      capture_debug:
        description: "Write OCR debug frames to artifacts"
        required: false
        type: boolean
        default: false
      ignore_market_hours:
        description: "Ignore strict market hour gate if source window is active"
        required: false
        type: boolean
        default: true
      run_ipo_batch:
        description: "Run ipo_competition_batch after OCR snapshots are updated"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: finuts-manual-stock-backfill
  cancel-in-progress: false

jobs:
  manual-stock-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install OCR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow rapidocr-onnxruntime playwright
          python -m playwright install chromium

      - name: Restore YouTube cookies
        run: |
          if [ -n "${YOUTUBE_COOKIES_TXT}" ]; then
            mkdir -p /tmp/ocr-secrets
            printf "%s" "${YOUTUBE_COOKIES_TXT}" > /tmp/ocr-secrets/youtube_cookies.txt
          fi
        env:
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}

      - name: Build temporary backfill config
        id: build-config
        run: |
          python tool/build_manual_stock_ocr_config.py \
            --stock-id "${{ inputs.stock_id }}" \
            --seed-path data/ipo_competition_seed.json \
            --output /tmp/manual_stock_ocr_config.json \
            --finuts-url "${{ inputs.finuts_url }}" \
            --deposit-manwon "${{ inputs.deposit_manwon }}"

      - name: Run manual OCR backfill
        env:
          FINUTS_ID: ${{ secrets.FINUTS_ID }}
          FINUTS_PASSWORD: ${{ secrets.FINUTS_PASSWORD }}
          YOUTUBE_COOKIES_PATH: /tmp/ocr-secrets/youtube_cookies.txt
        run: |
          OCR_ARGS=(
            --config /tmp/manual_stock_ocr_config.json
            --broker-snapshot-dir data/broker_snapshots
            --source-id "${{ inputs.stock_id }}"
          )

          if [ "${{ inputs.include_all_stocks }}" = "true" ]; then
            OCR_ARGS+=(--all-stocks)
          fi
          if [ "${{ inputs.include_all_stocks }}" != "true" ]; then
            echo "Single-stock mode: --all-stocks disabled; processing only --source-id ${{ inputs.stock_id }}"
          fi
          if [ "${{ inputs.ignore_market_hours }}" = "true" ]; then
            OCR_ARGS+=(--ignore-market-hours)
          fi
          if [ "${{ inputs.capture_debug }}" = "true" ]; then
            OCR_ARGS+=(--debug-frame-dir artifacts/video_ocr_debug)
          fi

          python tool/video_ocr_secondary_ingest.py "${OCR_ARGS[@]}"

      - name: Upload OCR debug frames
        if: always() && ${{ inputs.capture_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-backfill-debug-${{ inputs.stock_id }}
          path: artifacts/video_ocr_debug
          if-no-files-found: ignore

      - name: Rebuild derived IPO data
        if: ${{ inputs.run_ipo_batch }}
        run: |
          dart run tool/ipo_competition_batch.dart --backfill-years 3 --live-dir data/live_snapshots --outcome-dir data/outcomes --broker-snapshot-dir data/broker_snapshots
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ITICK_API_KEY: ${{ secrets.ITICK_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

      - name: Validate Finuts schedule sync
        run: python tool/validate_finuts_schedule_sync.py

      - name: Validate stock snapshots
        if: ${{ inputs.run_ipo_batch }}
        run: |
          python tool/validate_stock_snapshot_count.py \
            --stock-id "${{ inputs.stock_id }}"

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/discovered data/identifiers data/broker_snapshots ipo_competition_data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ipo-competition-bot"
          git config user.email "ipo-competition-bot@users.noreply.github.com"
          git add data/discovered data/identifiers data/broker_snapshots ipo_competition_data
          git commit -m "Backfill broker snapshots for ${{ inputs.stock_id }}"
          git push
