name: Video OCR secondary ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 23 * * 0-4"
    - cron: "*/10 0-9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: video-ocr-secondary-ingest
  cancel-in-progress: false

jobs:
  ingest-video-ocr-secondary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install OCR ingest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow rapidocr-onnxruntime playwright
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m playwright install chromium

      - name: Restore YouTube cookies
        run: |
          if [ -n "${YOUTUBE_COOKIES_TXT}" ]; then
            mkdir -p /tmp/ocr-secrets
            printf "%s" "${YOUTUBE_COOKIES_TXT}" > /tmp/ocr-secrets/youtube_cookies.txt
          fi
        env:
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}

      - name: Discover new IPOs and rebuild baseline data
        run: dart run tool/ipo_competition_batch.dart --backfill-years 3 --live-dir data/live_snapshots --outcome-dir data/outcomes --broker-snapshot-dir data/broker_snapshots
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ITICK_API_KEY: ${{ secrets.ITICK_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

      - name: Capture browser frame and write fallback broker snapshots
        run: |
          python tool/video_ocr_secondary_ingest.py --config data/video_ocr_sources.json --broker-snapshot-dir data/broker_snapshots --debug-frame-dir artifacts/video_ocr_debug
        env:
          YOUTUBE_COOKIES_PATH: /tmp/ocr-secrets/youtube_cookies.txt
          FINUTS_ID: ${{ secrets.FINUTS_ID }}
          FINUTS_PASSWORD: ${{ secrets.FINUTS_PASSWORD }}

      - name: Backfill Finuts broker snapshots for all known stocks
        run: |
          if [ -z "${FINUTS_ID}" ] || [ -z "${FINUTS_PASSWORD}" ]; then
            echo "FINUTS credentials are not configured. Skipping full Finuts backfill."
            exit 0
          fi
          python tool/video_ocr_secondary_ingest.py --config data/video_ocr_finuts_backfill.json --all-stocks --broker-snapshot-dir data/broker_snapshots
        env:
          FINUTS_ID: ${{ secrets.FINUTS_ID }}
          FINUTS_PASSWORD: ${{ secrets.FINUTS_PASSWORD }}

      - name: Upload OCR debug frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-ocr-debug
          path: artifacts/video_ocr_debug
          if-no-files-found: ignore

      - name: Rebuild derived IPO data
        run: dart run tool/ipo_competition_batch.dart --backfill-years 3 --live-dir data/live_snapshots --outcome-dir data/outcomes --broker-snapshot-dir data/broker_snapshots
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ITICK_API_KEY: ${{ secrets.ITICK_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/discovered data/identifiers data/broker_snapshots ipo_competition_data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ipo-competition-bot"
          git config user.email "ipo-competition-bot@users.noreply.github.com"
          git add data/discovered data/identifiers data/broker_snapshots ipo_competition_data
          git commit -m "Auto-refresh IPO data pipeline"
          git push
