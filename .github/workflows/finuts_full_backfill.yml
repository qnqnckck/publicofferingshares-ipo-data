name: Finuts full backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finuts-full-backfill
  cancel-in-progress: false

jobs:
  finuts-full-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow rapidocr-onnxruntime playwright
          python -m playwright install chromium

      - name: Backfill Finuts broker snapshots for all known stocks
        run: |
          if [ -z "${FINUTS_ID}" ] || [ -z "${FINUTS_PASSWORD}" ]; then
            echo "FINUTS credentials are not configured."
            exit 1
          fi
          python tool/video_ocr_secondary_ingest.py --config data/video_ocr_finuts_backfill.json --all-stocks --broker-snapshot-dir data/broker_snapshots
        env:
          FINUTS_ID: ${{ secrets.FINUTS_ID }}
          FINUTS_PASSWORD: ${{ secrets.FINUTS_PASSWORD }}

      - name: Rebuild derived IPO data
        run: dart run tool/ipo_competition_batch.dart --backfill-years 3 --live-dir data/live_snapshots --outcome-dir data/outcomes --broker-snapshot-dir data/broker_snapshots
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ITICK_API_KEY: ${{ secrets.ITICK_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

      - name: Validate Finuts schedule sync
        run: python tool/validate_finuts_schedule_sync.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/broker_snapshots ipo_competition_data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ipo-competition-bot"
          git config user.email "ipo-competition-bot@users.noreply.github.com"
          git add data/broker_snapshots ipo_competition_data
          git commit -m "Run manual Finuts full backfill"
          git push
