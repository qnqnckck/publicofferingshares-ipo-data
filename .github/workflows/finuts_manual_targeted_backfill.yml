name: Finuts manual targeted backfill

on:
  workflow_dispatch:
    inputs:
      stock_id:
        description: "Target stock id, e.g. machinarax_2026 or 마키나락스_2026-05-11"
        required: false
        type: string
      company:
        description: "Target company name"
        required: false
        type: string
      mode:
        description: "Backfill mode"
        required: true
        default: full
        type: choice
        options:
          - fundamentals
          - broker
          - full

permissions:
  contents: write

concurrency:
  group: finuts-manual-targeted-backfill
  cancel-in-progress: false

jobs:
  finuts-manual-targeted-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Ensure manual fundamentals file exists
        run: |
          if [ ! -f data/manual_fundamentals.json ]; then
            printf '{\n  "stocks": []\n}\n' > data/manual_fundamentals.json
          fi

      - name: Refresh targeted Finuts fundamentals
        if: ${{ inputs.mode == 'fundamentals' || inputs.mode == 'full' }}
        run: >
          python tool/finuts_fundamentals_sync.py
          --mode target
          --stock-id "${{ inputs.stock_id }}"
          --company "${{ inputs.company }}"

      - name: Refresh targeted Finuts broker snapshots
        if: ${{ inputs.mode == 'broker' || inputs.mode == 'full' }}
        run: >
          python tool/video_ocr_secondary_ingest.py
          --config data/finuts_sources.json
          --source-id "${{ inputs.stock_id }}"
          --ignore-market-hours
        env:
          FINUTS_ID: ${{ secrets.FINUTS_ID }}
          FINUTS_PASSWORD: ${{ secrets.FINUTS_PASSWORD }}

      - name: Rebuild derived IPO data
        run: >
          dart run tool/ipo_competition_batch.dart
          --backfill-years 3
          --manual-fundamentals-path data/manual_fundamentals.json
          --no-discover
          --no-identifier-discover
          --no-ipo-korea-supplement
          --no-article-lead-manager-discover
          --no-public-live-collect

      - name: Validate Finuts schedule sync
        continue-on-error: true
        run: python tool/validate_finuts_schedule_sync.py --warn-on-analysis-issues

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/broker_snapshots data/manual_fundamentals.json data/outcomes ipo_competition_data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ipo-competition-bot"
          git config user.email "ipo-competition-bot@users.noreply.github.com"
          git add data/broker_snapshots data/manual_fundamentals.json data/outcomes ipo_competition_data
          git commit -m "Run Finuts manual targeted backfill"
          git push
