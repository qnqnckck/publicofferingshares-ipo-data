name: Public IPO baseline discovery sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: public-baseline-discovery-sync
  cancel-in-progress: false

jobs:
  public-baseline-discovery-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Ensure manual fundamentals file exists
        run: |
          if [ ! -f data/manual_fundamentals.json ]; then
            printf '{\n  "stocks": []\n}\n' > data/manual_fundamentals.json
          fi

      - name: Refresh public IPO baseline data
        run: >
          dart run tool/ipo_competition_batch.dart
          --backfill-years 3
          --manual-fundamentals-path data/manual_fundamentals.json
          --no-finuts-discover
          --no-public-live-collect

      - name: Validate public schedule sync
        continue-on-error: true
        run: python tool/validate_finuts_schedule_sync.py --warn-on-analysis-issues

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/discovered data/outcomes ipo_competition_data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ipo-competition-bot"
          git config user.email "ipo-competition-bot@users.noreply.github.com"
          git add data/discovered data/outcomes ipo_competition_data
          git commit -m "Sync public IPO baseline data"
          git push
